aid: connected-robotics
name: Connected Robotics
description: >-
  Connected Robotics Inc. is a Japanese foodtech startup, founded in 2014 by
  Tetsuya Sawanobori and headquartered in Koganei, Tokyo, that develops
  specialized robotics and AI systems to automate labor-intensive work across
  food factories and restaurants. Its product line pairs AI image-processing and
  robot-control technology with purpose-built machines including the Delibot S
  plating robot, Delibot X filling robot, AI inspection software, a soft-serve
  ice-cream robot, and a french-fry cooking robot, targeting labor shortages,
  productivity, and food safety. The company has raised multiple rounds
  (including a July 2019 Series A led by Global Brain and a Series B closed in
  2023 with strategic investors such as Yaskawa Electric, Hoshizaki, and
  Mitsubishi HC Capital) and was surfaced in the API Evangelist network as a
  500 Global portfolio company. As a hardware and robotics manufacturer,
  Connected Robotics publishes no public web API, developer portal, or SDK at
  this time.
